services:
  db:
    image: postgres:17-alpine
    env_file: ./api/.env
    ports: ['127.0.0.1:5432:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: { context: ., dockerfile: api/Dockerfile.dev }
    command: npm run db:migrate -w api
    env_file: ./api/.env
    depends_on:
      db: { condition: service_healthy }
  api:
    build: { context: ., dockerfile: api/Dockerfile.dev }
    env_file: ./api/.env
    ports: ['3000:3000']
    volumes: ['./api/src:/app/api/src']
    depends_on:
      migrate: { condition: service_completed_successfully }
  client:
    build: { context: ., dockerfile: client/Dockerfile.dev }
    env_file: ./client/.env
    ports: ['5173:5173']
    volumes: ['./client/src:/app/client/src']
    depends_on: [api]
volumes:
  postgres-data:
