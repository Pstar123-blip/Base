<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project</title>
    <style>
      /* Values are injected from src/shared/constants.ts by vite.config.ts. */
      html[data-mui-color-scheme='light'] {
        background: __BACKGROUND_LIGHT__;
      }
      html[data-mui-color-scheme='dark'] {
        background: __BACKGROUND_DARK__;
      }
    </style>
    <script>
      // Apply the stored/system color scheme before first paint. The key is
      // injected from COLOR_MODE_STORAGE_KEY and passed to ThemeProvider.
      try {
        var mode =
          localStorage.getItem('__COLOR_MODE_STORAGE_KEY__') || 'system';
        var dark =
          mode === 'dark' ||
          (mode === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute(
          'data-mui-color-scheme',
          dark ? 'dark' : 'light',
        );
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
