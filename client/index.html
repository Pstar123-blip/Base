<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project</title>
    <style>
      html[data-mui-color-scheme='light'] { background: #f6f7fb; }
      html[data-mui-color-scheme='dark'] { background: #0f111a; }
    </style>
    <script>
      // Apply the stored/system color scheme before first paint (MUI default key).
      try {
        var mode = localStorage.getItem('mui-mode') || 'system';
        var dark =
          mode === 'dark' ||
          (mode === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute(
          'data-mui-color-scheme',
          dark ? 'dark' : 'light',
        );
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
