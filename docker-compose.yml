services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: { context: ., dockerfile: api/Dockerfile, target: dependencies }
    command: npm run db:migrate -w api
    env_file: ./api/.env
    depends_on:
      db: { condition: service_healthy }
  api:
    build: { context: ., dockerfile: api/Dockerfile, target: production }
    restart: unless-stopped
    env_file: ./api/.env
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      migrate: { condition: service_completed_successfully }
  client:
    build: { context: ., dockerfile: client/Dockerfile, target: production }
    restart: unless-stopped
    ports: ['8080:8080']
    depends_on:
      api: { condition: service_started }
volumes:
  postgres-data:
