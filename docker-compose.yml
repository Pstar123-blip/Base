services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ./api/.env
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: { context: ., dockerfile: api/Dockerfile, target: dependencies }
    command: npm run db:migrate -w api
    env_file: ./api/.env
    depends_on:
      db: { condition: service_healthy }
  api:
    build: { context: ., dockerfile: api/Dockerfile, target: production }
    restart: unless-stopped
    env_file: ./api/.env
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      migrate: { condition: service_completed_successfully }
  client:
    build: { context: ., dockerfile: client/Dockerfile, target: production }
    restart: unless-stopped
    ports: ['8080:8080']
    depends_on:
      api: { condition: service_healthy }
volumes:
  postgres-data:
